<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 适配移动端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }

        /* 日间模式（默认） */
        :root {
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #2d3748;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --btn-bg: #4f46e5;
            --btn-text: #fff;
        }

        /* 夜间模式 */
        .dark-mode {
            --bg-color: #1a1a2e;
            --card-color: #16213e;
            --text-color: #e0e0e0;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            --btn-bg: #c7d2fe;
            --btn-text: #1f2937;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        /* 卡片容器 */
        .profile-card {
            background: var(--card-color);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 90%;
            max-width: 420px;
        }

        /* 头像 */
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--btn-bg);
            margin: 0 auto 20px;
            display: block;
        }

        /* 姓名 */
        .name {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        /* 时钟样式 */
        .clock {
            font-size: 36px;
            font-weight: bold;
            margin: 30px 0;
            letter-spacing: 2px;
        }

        /* 切换按钮 */
        .toggle-btn {
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            outline: none;
        }

        .toggle-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <!-- 头像（可替换为你的图片链接） -->
        <img src="https://picsum.photos/200/200" alt="个人头像" class="avatar">
        <!-- 姓名（可修改） -->
        <h1 class="name">你的名字</h1>
        <!-- 数字时钟 -->
        <div id="clock" class="clock">00:00:00</div>
        <!-- 夜间模式切换按钮 -->
        <button id="toggleDark" class="toggle-btn">切换夜间模式</button>
    </div>

    <script>
        // ===================== 数字时钟功能 =====================
        function updateClock() {
            const now = new Date();
            // 格式化时间：不足两位补0
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        }
        // 立即执行一次 + 每秒刷新
        updateClock();
        setInterval(updateClock, 1000);

        // ===================== 夜间模式切换 =====================
        const toggleBtn = document.getElementById('toggleDark');
        toggleBtn.addEventListener('click', function () {
            // 切换body的dark-mode类
            document.body.classList.toggle('dark-mode');
            
            // 切换按钮文字
            if (document.body.classList.contains('dark-mode')) {
                toggleBtn.innerText = '切换日间模式';
            } else {
                toggleBtn.innerText = '切换夜间模式';
            }
        });
    </script>
</body>
</html>
